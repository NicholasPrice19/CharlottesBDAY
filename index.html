  <title>Happy Birthday</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --blush: #FFE4EC; --pink: #FF2E7E; --pink-soft: #FFB8CF;
      --plum: #2A0F2E; --note: #FFF7EC; --paper: #FFFFFF;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--blush); color: var(--plum);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 1.0625rem; line-height: 1.5; padding: 1.5rem 1rem;
    }
    main { width: 100%; max-width: 26rem; }
    h1 {
      margin: 0 0 0.5rem; font-size: clamp(2.25rem, 9vw, 3rem);
      font-weight: 800; line-height: 1; letter-spacing: -0.02em;
    }
    .hint {
      display: inline-block; margin: 0.75rem 0 1.5rem; padding: 0.6rem 1rem;
      background: var(--note); box-shadow: 3px 3px 0 var(--plum);
      font-family: "Patrick Hand", "Segoe Print", cursive; font-size: 1.5rem; line-height: 1.2;
    }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
    input {
      width: 100%; min-height: 3rem; padding: 0.6rem 0.9rem;
      border: 2px solid var(--plum); border-radius: 0.5rem; background: var(--paper);
      color: var(--plum); font: inherit; font-size: 1.125rem;
    }
    input:focus { outline: 3px solid var(--pink); outline-offset: 2px; }
    button {
      margin-top: 0.75rem; min-height: 3rem; padding: 0.5rem 1.4rem;
      border: 2px solid var(--plum); border-radius: 999px; background: var(--pink);
      color: var(--paper); font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--plum); }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { min-height: 1.5rem; margin: 0.75rem 0 0; font-weight: 600; color: var(--pink); }
    noscript p { font-weight: 600; }
  </style>
</head>

    var KEY_STORE = "birthday-quiz-key";
    var subtle = window.crypto && window.crypto.subtle;

    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

    // Lowercase, letters and numbers only, and drop a leading "the".
    function normalise(s) {
      s = String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
      if (s.indexOf("the") === 0 && s.length > 3) s = s.slice(3);
      return s;
    }

    function show(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function decryptPage(rawKey) {
      return subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]).then(function (key) {
        return subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.page));
      }).then(function (buf) {
        return new TextDecoder().decode(buf);
      });
    }

    function unwrap(answer) {
      var salt = b64(DATA.salt);
      return subtle.importKey("raw", new TextEncoder().encode(answer), "PBKDF2", false, ["deriveKey"])
        .then(function (base) {
          return subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: DATA.iterations, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function (kek) {
          // Try each accepted spelling's wrapped key in turn.
          var i = 0;
          function next() {
            if (i >= DATA.keys.length) return Promise.reject(new Error("wrong"));
            var w = DATA.keys[i++];
            return subtle.decrypt({ name: "AES-GCM", iv: b64(w.iv) }, kek, b64(w.data)).catch(next);
          }
          return next();
        });
    }

    var form = document.getElementById("gate");
    var input = document.getElementById("pw");
    var msg = document.getElementById("msg");
    var go = document.getElementById("go");

    if (!subtle) {
      msg.textContent = "This browser can't open the quiz. Try Safari or Chrome.";
      go.disabled = true;
      return;
    }

    // Already unlocked on this device? Skip the question.
    var saved = null;
    try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (saved) {
      decryptPage(b64(saved)).then(show).catch(function () {
        try { localStorage.removeItem(KEY_STORE); } catch (e) {}
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      go.disabled = true;
      msg.textContent = "";
      var raw;
      unwrap(normalise(input.value))
        .then(function (k) { raw = k; return decryptPage(k); })
        .then(function (html) {
          try { localStorage.setItem(KEY_STORE, toB64(raw)); } catch (e) {}
          show(html);
        })
        .catch(function () {
          go.disabled = false;
          msg.textContent = "Wrong. Try again, parma lover.";
          input.select();
        });
    });
